name: Cai dat thu vien & Chay Bot

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  ABJ_ZIP_URL: https://github.com/lxsgx23/AB-JChess/releases/download/v0.2b/0.2b_bmi2.zip

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    # gia han toi da 6h; bot chay ~55phut moi lan CI
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ---------- 1. CAI DAT THU VIEN HE THONG ----------
      - name: Cai dat thu vien he thong
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang git curl unzip tar
          clang --version | head -n1

      # ---------- 2. CAI DAT THU VIEN PYTHON ----------
      - name: Cai dat thu vien Python
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip list

      # ---------- 3. LAY ENGINE AB-JChess + NNUE ----------
      - name: Cache AB-JChess
        id: cache-engine
        uses: actions/cache@v4
        with:
          path: |
            AB-JChess
            abjchess-*.nnue
          key: abjchess-v0.2b-avx2

      - name: Tai AB-JChess tu mistboard release
        if: steps.cache-engine.outputs.cache-hit != 'true'
        run: |
          set -e
          API="https://api.github.com/repos/brianhliou/mistboard/releases?per_page=100"
          TAG=$(curl -fsSL "$API" | grep -o '"tag_name": *"engines-[^"]*"' | head -1 | sed 's/.*"\(engines-[^"]*\)"/\1/')
          echo "Tag tim thay: $TAG"
          test -n "$TAG"
          curl -fsSL --retry 3 -o /tmp/eng.tar.gz \
            "https://github.com/brianhliou/mistboard/releases/download/$TAG/engines-x86-64-sse41-popcnt.tar.gz"
          tar -xzf /tmp/eng.tar.gz -C /tmp ab-jchess
          cp /tmp/abjickess /dev/null 2>/dev/null || true
          cp /tmp/ab-jchess "$GITHUB_WORKSPACE/AB-JChess"
          chmod +x "$GITHUB_WORKSPACE/AB-JChess"
          echo "✅ Binary lay tu mistboard release $TAG"

      - name: Build AB-JChess tu source (fallback)
        if: always() && hashFiles('AB-JChess') == ''
        continue-on-error: true
        run: |
          work=$(mktemp -d)
          git init -q "$work/abjchess"
          git -C "$work/abjchess" fetch -q --depth 1 \
            https://github.com/lxsgx23/AB-JChess.git 1ae95ca6a960fc0caf32e791a67c8438aab60483
          git -C "$work/abjchess" checkout -q FETCH_HEAD
          make -C "$work/abjchess/src" -j"$(nproc)" ARCH=x86-64-avx2 COMP=clang EXTRALDFLAGS=-static build \
            || make -C "$work/abjchess/src" -j"$(nproc)" ARCH=x86-64-bmi2 COMP=gcc build
          if [ -f "$work/abjchess/src/AB-JChess" ]; then
            cp "$work/abjchess/src/AB-JChess" "$GITHUB_WORKSPACE/AB-JChess"
            chmod +x "$GITHUB_WORKSPACE/AB-JChess"
            echo "✅ Da build tu source"
          fi
          rm -rf "$work"

      - name: Tai NNUE (bat buoc)
        if: steps.cache-engine.outputs.cache-hit != 'true'
        run: |
          set -e
          curl -fsSL --retry 3 -o /tmp/abj.zip "$ABJ_ZIP_URL"
          unzip -o -q /tmp/abj.zip -d /tmp/net
          NNUE=$(find /tmp/net -name 'abjchess-*.nnue' | head -n1)
          test -n "$NNUE"
          cp "$NNUE" "$GITHUB_WORKSPACE/$(basename "$NNUE")"
          echo "✅ NNUE: $(basename "$NNUE")"

      - name: Smoke test engine
        run: |
          set -e
          chmod +x AB-JChess
          ls -la AB-JChess *.nnue
          printf 'uci\nquit\n' | timeout 20 ./AB-JChess | head -n 8
          test -s AB-JChess
          ls *.nnue > /dev/null
          echo "✅ Engine OK"

      # ---------- 4. KIEM TRA CU PHAP BOT ----------
      - name: Kiem tra cu phap
        run: |
          python -m py_compile cup_bot_hoanchinh.py
          echo "Syntax OK"

      # ---------- 5. CHAY BOT (55 phut, tuong doi) ----------
      - name: Chay bot
        env:
          CARO_USER19: ${{ secrets.CARO_USER19 }}
          CARO_PASSWD19: ${{ secrets.CARO_PASSWD19 }}
        run: |
          # gia han 55 phut de bot khong bi giet giua ván (truoc do chi 10 phut)
          timeout --signal=INT --kill-after=30 3300 python -u cup_bot_hoanchinh.py 2>&1 | tee bot.log || true
          echo "=== 20 dong cuoi bot.log ==="
          tail -n 20 bot.log || true
