name: Cai dat thu vien & Chay Bot (6h)

on:
  # CHỈ CHẠY KHI BẤM NÚT THỦ CÔNG - KHÔNG TỰ CHẠY KHI PUSH
  workflow_dispatch:


jobs:
  build-and-run:
    runs-on: ubuntu-latest
    # GitHub Actions gioi han 6h/job → dat 350 phut de co buffer
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ---------- 1. CAI DAT THU VIEN HE THONG ----------
      - name: Cai dat thu vien he thong
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang git curl unzip tar
          clang --version | head -n1

      # ---------- 2. CAI DAT THU VIEN PYTHON ----------
      - name: Cai dat thu vien Python
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip list

      # ---------- 3. LAY ENGINE Pikafish-Jieqi ----------
      - name: Cache Pikafish-Jieqi
        id: cache-engine
        uses: actions/cache@v4
        with:
          path: /tmp/engines/pikafish-jieqi
          key: pikafish-jieqi-v1

      - name: Tai Pikafish-Jieqi tu mistboard release
        if: steps.cache-engine.outputs.cache-hit != 'true'
        run: |
          set -e
          API="https://api.github.com/repos/brianhliou/mistboard/releases?per_page=100"
          TAG=$(curl -fsSL "$API" | grep -o '"tag_name": *"engines-[^"]*"' | head -1 | sed 's/.*"\(engines-[^"]*\)"/\1/')
          echo "Tag tim thay: $TAG"
          test -n "$TAG"
          curl -fsSL --retry 3 -o /tmp/eng.tar.gz \
            "https://github.com/brianhliou/mistboard/releases/download/$TAG/engines-x86-64-sse41-popcnt.tar.gz"
          mkdir -p /tmp/engines
          tar -xzf /tmp/eng.tar.gz -C /tmp/engines pikafish-jieqi pikafish.nnue
          chmod +x /tmp/engines/pikafish-jieqi
          echo "✅ Pikafish-Jieqi lay tu mistboard release $TAG"

      - name: Smoke test engine
        run: |
          set -e
          ls -la /tmp/engines/pikafish-jieqi
          printf 'uci\nquit\n' | timeout 20 /tmp/engines/pikafish-jieqi | head -n 5
          test -s /tmp/engines/pikafish-jieqi
          echo "✅ Engine OK"

      # ---------- 4. KIEM TRA CU PHAP BOT ----------
      - name: Kiem tra cu phap
        run: |
          python -m py_compile cup_bot_hoanchinh.py
          echo "Syntax OK"

      # ---------- 5. CHAY BOT (6 GIO) ----------
      # 21000 giây = 350 phút ≈ 5.8 giờ
      # Buffer 10 phút cho setup + cleanup
      - name: Chay bot
        run: |
          # INT truoc de bot co the cleanup, KILL sau 30s neu treo
          timeout --signal=INT --kill-after=300 21000 python -u cup_bot_hoanchinh.py 2>&1 | tee bot.log
          echo "=== 30 dong cuoi bot.log ==="
          tail -n 30 bot.log